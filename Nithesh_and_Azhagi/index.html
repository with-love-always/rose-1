<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Story</title>
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Cinzel:wght@400;600&display=swap"
        rel="stylesheet">
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050203;
            font-family: 'Cinzel', serif;
        }

        #star-canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .content-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            text-align: center;
            width: 100%;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* SVG Heart Drawing Animation */
        .svg-heart {
            width: 150px;
            height: 150px;
            margin-bottom: 2rem;
            cursor: pointer;
            filter: drop-shadow(0 0 10px rgba(220, 20, 60, 0.5));
            transition: transform 0.3s ease;
        }

        .svg-heart:hover {
            transform: scale(1.1);
        }

        .heart-path {
            fill: transparent;
            stroke: #ff4757;
            stroke-width: 2;
            stroke-dasharray: 1000;
            /* Approximate length */
            stroke-dashoffset: 1000;
            animation: drawHeart 4s ease-in-out forwards, fillHeart 1s ease-in-out 4s forwards;
        }

        @keyframes drawHeart {
            0% {
                stroke-dashoffset: 1000;
            }

            100% {
                stroke-dashoffset: 0;
            }
        }

        @keyframes fillHeart {
            to {
                fill: rgba(255, 71, 87, 0.2);
            }
        }

        /* Ambient Pulse for Heart after drawing */
        .svg-heart {
            animation: heartbeat 2s infinite 4.5s;
        }

        @keyframes heartbeat {
            0% {
                transform: scale(1);
                filter: drop-shadow(0 0 10px rgba(220, 20, 60, 0.5));
            }

            50% {
                transform: scale(1.05);
                filter: drop-shadow(0 0 25px rgba(220, 20, 60, 0.8));
            }

            100% {
                transform: scale(1);
                filter: drop-shadow(0 0 10px rgba(220, 20, 60, 0.5));
            }
        }

        h1 {
            font-size: 3.5rem;
            margin: 0;
            opacity: 0;
            background: linear-gradient(to right, #fff, #ffd700, #fff);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% auto;
            animation: fadeIn 2s ease-out 1s forwards, shine 5s linear infinite;
        }

        @keyframes shine {
            to {
                background-position: 200% center;
            }
        }

        p {
            font-family: 'Dancing Script', cursive;
            font-size: 1.5rem;
            color: #e0e0e0;
            margin-top: 1rem;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 2s ease-out 2.5s forwards;
        }

        .enter-btn {
            margin-top: 3rem;
            padding: 15px 40px;
            background: transparent;
            border: 1px solid rgba(255, 215, 0, 0.3);
            color: #ffd700;
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            letter-spacing: 3px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            opacity: 0;
            animation: fadeIn 2s ease-out 4s forwards;
            transition: all 0.5s;
        }

        .enter-btn:hover {
            background: rgba(255, 215, 0, 0.1);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.2);
            border-color: #ffd700;
        }

        .enter-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.4), transparent);
            transition: 0.5s;
        }

        .enter-btn:hover::before {
            left: 100%;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .curtain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 100;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }

        .curtain.active {
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>

<body>

    <canvas id="star-canvas"></canvas>

    <div class="content-wrapper">
        <svg class="svg-heart" viewBox="0 0 32 29.6" onclick="enterStory()">
            <path class="heart-path" d="M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,9.5,11.9,16,21.2
            c6.1-9.3,16-11.9,16-21.2C32,3.8,28.2,0,23.6,0z" />
        </svg>

        <h1>A Tale of Us</h1>
        <p>Before the dates, before the memories...</p>
        <p style="animation-delay: 3.5s; font-size: 1.2rem;">There was a moment.</p>

        <button class="enter-btn" onclick="enterStory()">OPEN THE BOOK</button>
    </div>

    <div class="curtain" id="transition-curtain"></div>

    <script>
        // High-Impact Particle System
        const canvas = document.getElementById('star-canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const particles = [];
        const colors = ['#ff4757', '#ff6b81', '#ffd700', '#ffffff'];

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.speedY = (Math.random() - 0.5) * 0.5;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.life = Math.random() * 100;
                this.alpha = Math.random();
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.life--;

                // Mouse interaction distance
                const dx = this.x - mouse.x;
                const dy = this.y - mouse.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < 100) {
                    this.x += dx * 0.01;
                    this.y += dy * 0.01;
                }

                if (this.life <= 0 || this.size <= 0.1) {
                    this.reset();
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.alpha * (this.life / 100); // Fade out
                ctx.fill();
                ctx.globalAlpha = 1;
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3;
                this.life = Math.random() * 100 + 50;
                this.alpha = Math.random();
            }
        }

        const mouse = { x: null, y: null };
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.x;
            mouse.y = e.y;
        });

        function init() {
            for (let i = 0; i < 150; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });

            // Connect particles nearby
            connectParticles();

            requestAnimationFrame(animate);
        }

        function connectParticles() {
            for (let a = 0; a < particles.length; a++) {
                for (let b = a; b < particles.length; b++) {
                    const dx = particles[a].x - particles[b].x;
                    const dy = particles[a].y - particles[b].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < 100) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(255, 255, 255, ${0.1 - distance / 1000})`;
                        ctx.lineWidth = 0.5;
                        ctx.moveTo(particles[a].x, particles[a].y);
                        ctx.lineTo(particles[b].x, particles[b].y);
                        ctx.stroke();
                    }
                }
            }
        }

        init();
        animate();

        // Resize handler
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        function enterStory() {
            document.getElementById('transition-curtain').classList.add('active');
            setTimeout(() => {
                window.location.href = "chapter1.html";
            }, 1000);
        }
    </script>
</body>

</html>
