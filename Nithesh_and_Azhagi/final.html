<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Question</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Outfit:wght@300;400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, rgba(255, 182, 193, 0.9), rgba(255, 105, 180, 0.85)),
                url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="strawberry" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r="1.5" fill="rgba(139,0,0,0.15)"/><circle cx="15" cy="8" r="1" fill="rgba(139,0,0,0.1)"/><circle cx="25" cy="12" r="1.2" fill="rgba(139,0,0,0.12)"/><circle cx="35" cy="5" r="1" fill="rgba(139,0,0,0.1)"/></pattern></defs><rect width="100" height="100" fill="url(%23strawberry)"/></svg>');
            background-color: #ffb6c1;
            background-blend-mode: overlay;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 15% 20%, rgba(255, 255, 255, 0.2), transparent 30%),
                radial-gradient(circle at 85% 80%, rgba(220, 20, 60, 0.15), transparent 35%),
                radial-gradient(circle at 50% 50%, rgba(255, 192, 203, 0.1), transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        /* Floating Hearts Background */
        .floating-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .heart {
            position: absolute;
            font-size: 2rem;
            opacity: 0.3;
            animation: floatHeart 15s linear infinite;
        }

        @keyframes floatHeart {
            0% {
                transform: translateY(110vh) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 0.4;
            }

            90% {
                opacity: 0.4;
            }

            100% {
                transform: translateY(-10vh) rotate(360deg);
                opacity: 0;
            }
        }

        .container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            text-align: center;
            padding: 20px;
            z-index: 10;
        }

        /* Romantic Intro */
        .romantic-intro {
            margin-bottom: 2rem;
            opacity: 0;
            animation: fadeIn 2s ease-out forwards;
        }

        .intro-line {
            font-size: 1.3rem;
            color: rgba(255, 255, 255, 0.9);
            margin: 0.8rem 0;
            opacity: 0;
            animation: slideUp 1s ease-out forwards;
            font-family: 'Outfit', sans-serif;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .highlight-text {
            font-size: 1.6rem !important;
            font-family: 'Dancing Script', cursive !important;
            color: #ffd700 !important;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.6) !important;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Sparkles */
        .sparkles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        .sparkle {
            position: absolute;
            color: #ffd700;
            font-size: 1.5rem;
            opacity: 0;
            animation: sparkleAnim 3s ease-in-out infinite;
        }

        @keyframes sparkleAnim {

            0%,
            100% {
                opacity: 0;
                transform: scale(0) rotate(0deg);
            }

            50% {
                opacity: 1;
                transform: scale(1) rotate(180deg);
            }
        }

        h1 {
            font-size: 3.5rem;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3),
                0 0 30px rgba(255, 255, 255, 0.5);
            margin-bottom: 1rem;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        .subtitle {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 3rem;
            font-family: 'Outfit', sans-serif;
            animation: fadeIn 2s ease-out forwards 2.5s;
            opacity: 0;
        }

        .buttons {
            display: flex;
            gap: 20px;
            position: relative;
            z-index: 10;
            opacity: 0;
            animation: fadeIn 1s ease-out forwards 3.5s;
        }

        .btn-yes {
            background: linear-gradient(135deg, #4CAF50, #45a049, #66BB6A);
            color: white;
            padding: 20px 50px;
            font-size: 1.8rem;
            font-weight: bold;
            border: 3px solid rgba(255, 255, 255, 0.5);
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(76, 175, 80, 0.5),
                0 0 40px rgba(76, 175, 80, 0.3),
                inset 0 -3px 10px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            animation: pulseGlow 2s ease-in-out infinite;
        }

        @keyframes pulseGlow {

            0%,
            100% {
                box-shadow: 0 10px 30px rgba(76, 175, 80, 0.5),
                    0 0 40px rgba(76, 175, 80, 0.3),
                    inset 0 -3px 10px rgba(0, 0, 0, 0.2);
            }

            50% {
                box-shadow: 0 10px 40px rgba(76, 175, 80, 0.8),
                    0 0 60px rgba(76, 175, 80, 0.6),
                    inset 0 -3px 10px rgba(0, 0, 0, 0.2);
            }
        }

        .btn-yes::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transform: rotate(45deg);
            animation: shine 3s linear infinite;
        }

        @keyframes shine {
            0% {
                transform: translateX(-100%) rotate(45deg);
            }

            100% {
                transform: translateX(100%) rotate(45deg);
            }
        }

        .btn-yes:hover {
            transform: scale(1.15) translateY(-5px);
            box-shadow: 0 15px 50px rgba(76, 175, 80, 0.8),
                0 0 80px rgba(76, 175, 80, 0.6),
                inset 0 -3px 10px rgba(0, 0, 0, 0.2);
        }

        .btn-yes:active {
            transform: scale(1.05) translateY(-2px);
        }

        .btn-no {
            background: linear-gradient(135deg, #f44336, #e53935, #ef5350);
            color: white;
            padding: 20px 50px;
            font-size: 1.8rem;
            font-weight: bold;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            cursor: pointer;
            position: relative;
            box-shadow: 0 8px 25px rgba(244, 67, 54, 0.4),
                inset 0 -3px 10px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .btn-no:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(244, 67, 54, 0.6);
        }

        /* Success Message Overlay */
        .success-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s;
        }

        .success-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .success-text {
            font-family: 'Dancing Script', cursive;
            font-size: 3rem;
            color: #ffd700;
            animation: bounceIn 1s forwards;
        }

        @keyframes bounceIn {
            0% {
                transform: scale(0.3);
                opacity: 0;
            }

            50% {
                transform: scale(1.05);
                opacity: 1;
            }

            70% {
                transform: scale(0.9);
            }

            100% {
                transform: scale(1);
            }
        }

        .cat-heart {
            max-width: 300px;
            margin-top: 20px;
            border-radius: 15px;
        }
    </style>
</head>

<body>

    <!-- Floating Hearts Background -->
    <div class="floating-hearts" id="heartsContainer"></div>

    <!-- Sparkles -->
    <div class="sparkles" id="sparklesContainer"></div>

    <div class="container" id="proposal-container">
        <div class="romantic-intro">
            <p class="intro-line" style="animation-delay: 0.5s;">From the first moment...</p>
            <p class="intro-line" style="animation-delay: 1s;">To every laugh we shared...</p>
            <p class="intro-line" style="animation-delay: 1.5s;">Every memory we made...</p>
            <p class="intro-line highlight-text" style="animation-delay: 2s;">You've been my everything.</p>
        </div>

        <h1>Will you be Mine... forever?</h1>
        <p class="subtitle">💕 This is the moment that changes everything 💕</p>

        <div class="buttons">
            <button class="btn-yes" onclick="acceptLove()">YES 💖</button>
            <button class="btn-no" id="noBtn" onmouseover="dodge(this)" ontouchstart="dodge(this)"
                onclick="dodge(this)">NO 💔</button>
        </div>
    </div>

    <!-- Success Screen -->
    <div class="success-overlay" id="successScreen">
        <h1 class="success-text">I knew the moon was mine! 🌙❤️</h1>
        <p style="font-size: 1.5rem; margin-top: 10px;">You were always meant to be.</p>
        <img src="https://media.tenor.com/gUu17GRrW0AAAAAC/snuggles-caring.gif" alt="Happy Hug" class="cat-heart">

        <button class="btn-yes" style="margin-top: 30px; font-size: 1rem;" onclick="showRevisit()">Take me back to the
            start ↺</button>
    </div>

    <script>
        // Generate Floating Hearts
        const heartsContainer = document.getElementById('heartsContainer');
        const heartSymbols = ['❤️', '💕', '💖', '💗', '💝', '💞', '🍓', '🍓', '🍓'];

        for (let i = 0; i < 25; i++) {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerText = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
            heart.style.left = Math.random() * 100 + '%';
            heart.style.animationDelay = Math.random() * 10 + 's';
            heart.style.fontSize = (Math.random() * 20 + 20) + 'px';
            heartsContainer.appendChild(heart);
        }

        // Generate Sparkles
        const sparklesContainer = document.getElementById('sparklesContainer');
        for (let i = 0; i < 30; i++) {
            const sparkle = document.createElement('div');
            sparkle.classList.add('sparkle');
            sparkle.innerText = '✨';
            sparkle.style.left = Math.random() * 100 + '%';
            sparkle.style.top = Math.random() * 100 + '%';
            sparkle.style.animationDelay = Math.random() * 3 + 's';
            sparklesContainer.appendChild(sparkle);
        }

        const noTexts = [
            "Are you sure?",
            "Really sure?",
            "Think again!",
            "Last chance!",
            "Surely not?",
            "You might regret this!",
            "Give it another thought!",
            "Are you absolutely certain?",
            "This could be a mistake!",
            "Have a heart!",
            "Don't be so cold!",
            "Change of heart?",
            "Wouldn't you reconsider?",
            "Is that your final answer?",
            "You're breaking my heart ;(",
        ];

        function dodge(btn) {
            // Change text
            const randomText = noTexts[Math.floor(Math.random() * noTexts.length)];
            btn.innerText = randomText;

            // Calculate random position
            const container = document.querySelector('.container');
            const containerRect = container.getBoundingClientRect();
            const btnRect = btn.getBoundingClientRect();

            // Generate random X and Y within window bounds (safer than container sometimes)
            const randomX = Math.random() * (window.innerWidth - btnRect.width - 50);
            const randomY = Math.random() * (window.innerHeight - btnRect.height - 50);

            btn.style.position = 'fixed'; // Use fixed to fly anywhere on screen
            btn.style.left = randomX + 'px';
            btn.style.top = randomY + 'px';
        }

        function acceptLove() {
            const overlay = document.getElementById('successScreen');
            overlay.classList.add('visible');

            // Fire Confetti
            var duration = 5 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 200 };

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            var interval = setInterval(function () {
                var timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                var particleCount = 50 * (timeLeft / duration);

                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);
        }

        function showRevisit() {
            window.location.href = "index.html";
        }

        // Persistent Background Music
        const bgm = new Audio('_Kadal_Alai_Pola_Tamil_Song_Ringtone_(by Fringster.com).mp3');
        bgm.loop = true;
        bgm.volume = 0.5;

        if (sessionStorage.getItem('bgm_playing') === 'true') {
            const savedTime = sessionStorage.getItem('bgm_time');
            if (savedTime) {
                bgm.currentTime = parseFloat(savedTime);
            }
            bgm.play().catch(e => console.log("Audio play failed:", e));
        }

        setInterval(() => {
            if (!bgm.paused) {
                sessionStorage.setItem('bgm_time', bgm.currentTime);
            }
        }, 1000);
    </script>
</body>

</html>
