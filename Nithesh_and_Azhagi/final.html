<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Question</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Outfit:wght@300;400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
        }

        @keyframes gradient {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 3.5rem;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            margin-bottom: 3rem;
        }

        .buttons {
            display: flex;
            gap: 20px;
            position: relative;
            z-index: 10;
        }

        .btn-yes {
            background-color: #4CAF50;
            /* Green */
            color: white;
            padding: 15px 40px;
            font-size: 1.5rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s;
        }

        .btn-yes:hover {
            transform: scale(1.1);
        }

        .btn-no {
            background-color: #f44336;
            /* Red */
            color: white;
            padding: 15px 40px;
            font-size: 1.5rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            position: relative;
            /* Changed from absolute to relative initially */
            transition: all 0.2s ease;
        }

        /* Success Message Overlay */
        .success-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s;
        }

        .success-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .success-text {
            font-family: 'Dancing Script', cursive;
            font-size: 3rem;
            color: #ffd700;
            animation: bounceIn 1s forwards;
        }

        @keyframes bounceIn {
            0% {
                transform: scale(0.3);
                opacity: 0;
            }

            50% {
                transform: scale(1.05);
                opacity: 1;
            }

            70% {
                transform: scale(0.9);
            }

            100% {
                transform: scale(1);
            }
        }

        .cat-heart {
            max-width: 300px;
            margin-top: 20px;
            border-radius: 15px;
        }
    </style>
</head>

<body>

    <div class="container" id="proposal-container">
        <h1>Will you be Mine... forever?</h1>

        <div class="buttons">
            <button class="btn-yes" onclick="acceptLove()">YES 💖</button>
            <button class="btn-no" id="noBtn" onmouseover="dodge(this)" ontouchstart="dodge(this)"
                onclick="dodge(this)">NO 💔</button>
        </div>
    </div>

    <!-- Success Screen -->
    <div class="success-overlay" id="successScreen">
        <h1 class="success-text">I knew it! ❤️</h1>
        <p style="font-size: 1.5rem; margin-top: 10px;">You were always Mine.</p>
        <img src="https://media.tenor.com/gUu17GRrW0AAAAAC/snuggles-caring.gif" alt="Happy Hug" class="cat-heart">

        <button class="btn-yes" style="margin-top: 30px; font-size: 1rem;" onclick="showRevisit()">Take me back to the
            start ↺</button>
    </div>

    <script>
        const noTexts = [
            "Are you sure?",
            "Really sure?",
            "Think again!",
            "Last chance!",
            "Surely not?",
            "You might regret this!",
            "Give it another thought!",
            "Are you absolutely certain?",
            "This could be a mistake!",
            "Have a heart!",
            "Don't be so cold!",
            "Change of heart?",
            "Wouldn't you reconsider?",
            "Is that your final answer?",
            "You're breaking my heart ;(",
        ];

        function dodge(btn) {
            // Change text
            const randomText = noTexts[Math.floor(Math.random() * noTexts.length)];
            btn.innerText = randomText;

            // Calculate random position
            const container = document.querySelector('.container');
            const containerRect = container.getBoundingClientRect();
            const btnRect = btn.getBoundingClientRect();

            // Generate random X and Y within window bounds (safer than container sometimes)
            const randomX = Math.random() * (window.innerWidth - btnRect.width - 50);
            const randomY = Math.random() * (window.innerHeight - btnRect.height - 50);

            btn.style.position = 'fixed'; // Use fixed to fly anywhere on screen
            btn.style.left = randomX + 'px';
            btn.style.top = randomY + 'px';
        }

        function acceptLove() {
            const overlay = document.getElementById('successScreen');
            overlay.classList.add('visible');

            // Fire Confetti
            var duration = 5 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 200 };

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            var interval = setInterval(function () {
                var timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                var particleCount = 50 * (timeLeft / duration);

                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);
        }

        function showRevisit() {
            window.location.href = "index.html";
        }

        // Persistent Background Music
        const bgm = new Audio('_Kadal_Alai_Pola_Tamil_Song_Ringtone_(by Fringster.com).mp3');
        bgm.loop = true;
        bgm.volume = 0.5;

        if (sessionStorage.getItem('bgm_playing') === 'true') {
            const savedTime = sessionStorage.getItem('bgm_time');
            if (savedTime) {
                bgm.currentTime = parseFloat(savedTime);
            }
            bgm.play().catch(e => console.log("Audio play failed:", e));
        }

        setInterval(() => {
            if (!bgm.paused) {
                sessionStorage.setItem('bgm_time', bgm.currentTime);
            }
        }, 1000);
    </script>
</body>

</html>
